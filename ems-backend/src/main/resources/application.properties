#=========================================================================
# SERVER CONFIGURATION
#=========================================================================

#=========================================================================
# APPLICATION IDENTITY
#=========================================================================
spring.application.name=ems-backend

#=========================================================================
# DATABASE CONFIGURATION (MySQL Example)
#=========================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/db_ems
spring.datasource.username=ems
spring.datasource.password= ems@2026

#=========================================================================
# JPA / HIBERNATE PROPERTIES
#=========================================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Automatically updates the database schema based on Java entities
spring.jpa.hibernate.ddl-auto=update
# Show SQL queries in the console log for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


